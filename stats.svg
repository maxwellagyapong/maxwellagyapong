<g data-testid="main-card-body" transform="translate(0, 55)">
  
  <!-- Rank circle -->
  <g data-testid="rank-circle" transform="translate(390.5, 47.5)">
    <circle class="rank-circle-rim" cx="-10" cy="8" r="40" />
    <circle class="rank-circle" cx="-10" cy="8" r="40" />
    <g class="rank-text">
      <text x="-5" y="3" alignment-baseline="central" dominant-baseline="central" text-anchor="middle" data-testid="level-rank-icon">
        B+
      </text>
    </g>
  </g>

  <!-- Commits -->
  <g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms" transform="translate(25, 0)">
      <svg data-testid="icon" class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M8 .25a.75.75 ..."/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Total Commits (this year):</text>
      <text class="stat bold" x="219.01" y="12.5" data-testid="commits">646</text>
    </g>
  </g>

  <!-- PRs -->
  <g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms" transform="translate(25, 0)">
      <svg data-testid="icon" class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M7.177 3.073 ..."/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Total PRs:</text>
      <text class="stat bold" x="219.01" y="12.5" data-testid="prs">27</text>
    </g>
  </g>

  <!-- Contributed to -->
  <g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms" transform="translate(25, 0)">
      <svg data-testid="icon" class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M2 2.5A2.5 ..."/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Contributed to (this year):</text>
      <text class="stat bold" x="219.01" y="12.5" data-testid="contribs">0</text>
    </g>
  </g>

</g>
