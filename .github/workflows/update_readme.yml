name: Update README with Stats

on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Generates the cards ourselves with YOUR token, so private
      # contributions and private-repo languages are counted.
      # The token never leaves GitHub (no third-party stats service).
      - name: Generate stats cards
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit and push
        run: |
          git config user.name "Maxwell Agyapong"
          git config user.email "35528366+maxwellagyapong@users.noreply.github.com"
          git add stats.svg streak.svg top-langs.svg
          git diff --cached --quiet || git commit -m "Auto-update GitHub stats"
          git push origin HEAD:main
